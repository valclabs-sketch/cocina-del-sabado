<style>
/* Layout: una columna de app (máx. 920px), pestañas fijas arriba, tarjetas solo donde separan un objeto. */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --sunk:#E9EDE4; --ink:#1B241E; --muted:#5A675E; --line:#D9E0D5;
  --accent:#2C6A48; --accent-ink:#FFFFFF; --accent-soft:#DCEBDF;
  --prot:#C2462C; --carb:#B98618; --veg:#4F9646; --warn:#B4541A; --ok:#2C7A4B;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#19201B; --sunk:#141A16; --ink:#E6ECE6; --muted:#98A69C; --line:#2A342D;
  --accent:#7CC59A; --accent-ink:#0D1A12; --accent-soft:#1F3428;
  --prot:#F07C61; --carb:#E2B64D; --veg:#8CCB7F; --warn:#F0A26A; --ok:#7CC59A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#19201B; --sunk:#141A16; --ink:#E6ECE6; --muted:#98A69C; --line:#2A342D;
  --accent:#7CC59A; --accent-ink:#0D1A12; --accent-soft:#1F3428;
  --prot:#F07C61; --carb:#E2B64D; --veg:#8CCB7F; --warn:#F0A26A; --ok:#7CC59A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,34px);letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.sync{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.sync.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
button.sync{font-weight:600;cursor:pointer}
.sync.cta{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:700}
.steps-inst{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:14px;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:12px 12px 10px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{display:flex;flex-direction:column;gap:22px;padding-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button:hover{filter:brightness(.97)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
input[type=number]{width:100%}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12.5px;color:var(--muted);font-weight:600}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.banner b{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:6px 14px;font-weight:600;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Hoy */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero .plate{justify-self:center}}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.t{background:var(--sunk);border-radius:10px;padding:10px 12px}
.t b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.timeline{display:flex;flex-direction:column;margin-top:6px}
.tl{display:grid;grid-template-columns:76px 14px minmax(0,1fr);gap:10px;padding:9px 0}
.tl .h{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.tl .ln{position:relative}
.tl .ln::before{content:"";position:absolute;left:6px;top:0;bottom:-18px;width:2px;background:var(--line)}
.tl:last-child .ln::before{display:none}
.tl .ln i{position:absolute;left:1px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl.move .ln i{border-color:var(--prot);background:var(--prot)}
.tl .what b{display:block}
/* Almuerzo */
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rc{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;font-weight:500}
.rc[aria-pressed="true"]{border:2px solid var(--accent);padding:11px 13px;background:var(--accent-soft)}
.rc .nm{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.2}
.macros{display:flex;gap:14px;flex-wrap:wrap}
.macros div{display:flex;flex-direction:column}
.macros b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
td.r,th.r{text-align:right}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.containers{display:flex;flex-wrap:wrap;gap:5px}
.box{width:26px;height:19px;border-radius:5px;border:2px solid var(--accent);background:var(--accent-soft)}
.box.k{width:20px;height:16px;border-color:var(--carb)}
/* Mercado */
.budget{display:flex;flex-direction:column;gap:8px}
.meter{height:14px;border-radius:8px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.over i{background:var(--warn)}
.list{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.it input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.it.done .nm{text-decoration:line-through;color:var(--muted)}
.it .nm{font-weight:600}
.it .q{font-size:13px;color:var(--muted)}
.it .c{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.edit{display:grid;grid-template-columns:minmax(0,1.4fr) 90px 110px 40px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.edit .nm{font-weight:600;font-size:14px}
@media (max-width:520px){.edit{grid-template-columns:minmax(0,1fr) 80px 96px 36px}}
.x{padding:6px 8px;min-width:0}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
/* Progreso */
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<script>
/* ============ Datos base ============ */
// Valores por 100 g en crudo; price = precio de referencia por kg (COP), editable en Mercado.
const ING = {
  pollo:{n:'Pechuga de pollo',k:120,p:23,c:0,f:2.6,price:18000,cat:'Proteína'},
  carne:{n:'Carne molida de res magra',k:176,p:20,c:0,f:10,price:28000,cat:'Proteína'},
  cerdo:{n:'Lomo de cerdo',k:143,p:21,c:0,f:6,price:24000,cat:'Proteína'},
  basa:{n:'Filete de basa (congelado)',k:90,p:15,c:0,f:3,price:20000,cat:'Proteína'},
  huevo:{n:'Huevo',k:143,p:12.6,c:.7,f:9.5,price:9500,cat:'Proteína',unitG:60},
  lenteja:{n:'Lentejas',k:352,p:25,c:60,f:1,price:9000,cat:'Granos'},
  frijol:{n:'Fríjol rojo',k:333,p:23,c:60,f:1,price:12000,cat:'Granos'},
  garbanzo:{n:'Garbanzos',k:364,p:19,c:61,f:6,price:11000,cat:'Granos'},
  arroz:{n:'Arroz',k:360,p:7,c:79,f:.6,price:4500,cat:'Granos'},
  pasta:{n:'Pasta corta',k:371,p:13,c:75,f:1.5,price:8000,cat:'Granos'},
  avena:{n:'Avena en hojuelas',k:389,p:17,c:66,f:7,price:9000,cat:'Granos'},
  papa:{n:'Papa',k:77,p:2,c:17,f:.1,price:3000,cat:'Verdura'},
  platano:{n:'Plátano maduro',k:122,p:1.3,c:32,f:.4,price:4000,cat:'Verdura'},
  ahuyama:{n:'Ahuyama',k:26,p:1,c:6.5,f:.1,price:3000,cat:'Verdura'},
  habichuela:{n:'Habichuela',k:31,p:1.8,c:7,f:.2,price:5000,cat:'Verdura'},
  brocoli:{n:'Brócoli',k:34,p:2.8,c:7,f:.4,price:9000,cat:'Verdura'},
  zanahoria:{n:'Zanahoria',k:41,p:.9,c:10,f:.2,price:3000,cat:'Verdura'},
  tomate:{n:'Tomate',k:18,p:.9,c:3.9,f:.2,price:4500,cat:'Verdura'},
  cebolla:{n:'Cebolla cabezona',k:40,p:1.1,c:9.3,f:.1,price:3500,cat:'Verdura'},
  pimenton:{n:'Pimentón',k:26,p:1,c:6,f:.3,price:7000,cat:'Verdura'},
  calabacin:{n:'Calabacín',k:17,p:1.2,c:3.1,f:.3,price:6000,cat:'Verdura'},
  arveja:{n:'Arveja (congelada)',k:81,p:5.4,c:14,f:.4,price:9000,cat:'Verdura'},
  espinaca:{n:'Espinaca',k:23,p:2.9,c:3.6,f:.4,price:12000,cat:'Verdura'},
  repollo:{n:'Repollo',k:25,p:1.3,c:6,f:.1,price:2500,cat:'Verdura'},
  aceite:{n:'Aceite vegetal',k:884,p:0,c:0,f:100,price:10000,cat:'Despensa'}
};
// Gramos por porción de ADULTO. La niña come una fracción (ajustable).
const RECIPES = [
 {id:'pollo-hogao',name:'Pollo en hogao con arroz, ahuyama y habichuela',prot:'Pollo',time:'1 h 15 min',
  items:{pollo:150,arroz:60,ahuyama:150,habichuela:100,tomate:70,cebolla:40,aceite:5},
  steps:['Corta el pollo en cubos, sazona con sal, comino, ajo y color. Sella en olla grande con la mitad del aceite.','Haz el hogao con tomate y cebolla picados; agrega el pollo y ½ taza de agua. Cocina tapado 20 min.','Cocina el arroz aparte (2 tazas de agua por taza de arroz).','Ahuyama en cubos al horno o al vapor 20 min. Habichuela al vapor 6 min, que quede firme.','Deja enfriar 30 min y porciona: proteína, arroz y verduras en cada recipiente.'],
  tip:'Para variar: mitad de las porciones con limón y orégano en vez de hogao.'},
 {id:'bolonesa',name:'Pasta a la boloñesa con verduras escondidas',prot:'Res',time:'1 h',
  items:{carne:130,pasta:70,tomate:150,zanahoria:60,calabacin:100,cebolla:40,aceite:3},
  steps:['Ralla la zanahoria y el calabacín: se pierden en la salsa (ideal para la niña).','Sofríe cebolla, agrega la carne y dórala bien. Suma tomate licuado y verduras ralladas.','Cocina la salsa 25 min a fuego bajo, con orégano y laurel.','Cocina la pasta 2 min menos de lo que dice el paquete, para que no quede blanda al recalentar.','Enfría y porciona la salsa encima de la pasta.'],
  tip:'Pon queso rallado solo al servir, no antes de congelar.'},
 {id:'lentejas-pollo',name:'Lentejas con pollo desmechado, arroz y brócoli',prot:'Pollo + lenteja',time:'1 h 10 min',
  items:{lenteja:60,pollo:90,arroz:45,zanahoria:60,tomate:50,cebolla:30,brocoli:100,aceite:4},
  steps:['Remoja las lentejas 30 min (opcional) y cocínalas con zanahoria en cubos 25 min.','Cocina el pollo en agua con cebolla y ajo 20 min; desmecha y guarda el caldo.','Haz un hogao, únelo con las lentejas, el pollo y un poco del caldo.','Arroz aparte. Brócoli al vapor 4 min y pásalo a agua fría.','Porciona y congela.'],
  tip:'Las lentejas dan fibra y proteína barata: sacian mucho con menos carne.'},
 {id:'frijoles-cerdo',name:'Fríjoles con cerdo, arroz, maduro al horno y repollo',prot:'Cerdo + fríjol',time:'2 h (olla a presión: 1 h)',
  items:{frijol:60,cerdo:100,arroz:40,platano:50,repollo:100,tomate:40,cebolla:30,zanahoria:40,aceite:3},
  steps:['Remoja los fríjoles desde el viernes en la noche. Cocínalos en olla a presión 40 min con zanahoria.','Corta el cerdo en cubos sin grasa visible y cocínalo con hogao 20 min.','Arroz aparte. Maduro en tajadas al horno 20 min, sin freír.','Repollo en tiras salteado 3 min con un poco de sal.','Porciona: la porción de maduro es pequeña, 2 o 3 tajadas.'],
  tip:'El día que lo coman, una cucharada de aguacate encima si hay presupuesto.'},
 {id:'albondigas',name:'Albóndigas en salsa de tomate con puré de papa y brócoli',prot:'Res',time:'1 h 15 min',
  items:{carne:140,avena:10,huevo:15,papa:170,tomate:130,cebolla:35,brocoli:100,zanahoria:40,aceite:3},
  steps:['Mezcla la carne con avena, huevo, cebolla rallada, sal y comino. Forma bolitas del tamaño de una nuez.','Hornéalas 15 min a 200 °C (no se fríen).','Haz la salsa con tomate y zanahoria licuados; agrega las albóndigas y cocina 10 min.','Puré con papa cocida y un poco del agua de cocción (sin mantequilla o con muy poca).','Brócoli al vapor. Porciona y congela.'],
  tip:'A la niña le suelen gustar: ayúdales a formar las bolitas el sábado.'},
 {id:'arroz-pollo',name:'Arroz con pollo y verduras',prot:'Pollo',time:'1 h',
  items:{arroz:65,pollo:150,arveja:50,zanahoria:60,pimenton:40,habichuela:60,cebolla:30,aceite:5},
  steps:['Cocina el pollo en agua con cebolla y ajo; desmecha y guarda el caldo.','Sofríe cebolla y pimentón, agrega el arroz y tuéstalo 2 min.','Cocina el arroz con el caldo (en vez de agua) y color.','A los 10 min agrega zanahoria, arveja y habichuela picadas; al final mezcla el pollo.','Enfría extendido en una bandeja antes de porcionar.'],
  tip:'Es plato único: casi la mitad del recipiente deben ser verduras y pollo, no arroz.'},
 {id:'garbanzos',name:'Garbanzos guisados con pollo, espinaca y ahuyama',prot:'Pollo + garbanzo',time:'1 h 30 min',
  items:{garbanzo:55,pollo:110,arroz:45,espinaca:70,tomate:80,cebolla:30,pimenton:30,ahuyama:100,aceite:4},
  steps:['Remoja los garbanzos desde el viernes. Cocínalos 40 min en olla a presión.','Sofríe cebolla, pimentón y tomate con comino y paprika.','Agrega el pollo en cubos, la ahuyama y los garbanzos con un poco de su agua. Cocina 20 min.','Al final agrega la espinaca y apaga apenas se ablande.','Arroz aparte. Porciona y congela.'],
  tip:'Si no consiguen espinaca, usa acelga o más ahuyama.'},
 {id:'basa',name:'Basa en salsa criolla con arroz, brócoli y arveja',prot:'Pescado',time:'50 min',
  items:{basa:180,arroz:60,brocoli:100,zanahoria:60,arveja:40,tomate:60,cebolla:30,pimenton:30,aceite:6},
  steps:['Descongela la basa en la nevera desde el viernes.','Haz una salsa con tomate, cebolla y pimentón; pon la basa en trozos encima y cocina tapado 8 min.','Arroz aparte. Brócoli, zanahoria y arveja al vapor.','Enfría rápido y porciona. Este plato se come mejor en la primera mitad de la semana.'],
  tip:'Pescado una vez al mes ayuda a la variedad y es de lo más económico en proteína.'}
];
// Lo que se compra para desayunos, cenas y meriendas de la semana (3 personas).
const STAPLES = [
 {id:'huevos',n:'Huevos',qty:30,u:'unid',price:570,cat:'Lácteos y huevos'},
 {id:'leche',n:'Leche semidescremada',qty:6,u:'L',price:4300,cat:'Lácteos y huevos'},

const last = {}; const timers = {}; const busy = {}; const again = {};
function cacheLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)) }catch(e){} }
function queue(key){ cacheLocal(); clearTimeout(timers[key]); timers[key] = setTimeout(() => flush(key), 700); }
async function flush(key){
  if (!cloud) return;
  if (busy[key]) { again[key] = true; return; }
  busy[key] = true;
  const data = clone(S[key]); last[key] = JSON.stringify(data);
  const { error } = await sb.from('cocina_docs').upsert({ key, data, updated_at: new Date().toISOString(), updated_by: user && user.email });
  if (error) toast(navigator.onLine ? 'No se pudo guardar en la nube: ' + error.message : 'Sin internet: quedó guardado en este celular.');
  busy[key] = false;
  if (again[key]) { again[key] = false; flush(key); }
}
const SYNC_TXT = {
  on:'Compartido con la familia', wait:'Conectando…', local:'Solo en este celular',
  login:'Iniciar sesión', notable:'Falta preparar la base de datos', nomember:'Correo fuera de la familia', offline:'Sin conexión'
};
function setSync(mode){
  syncMode = mode;
  const el = document.getElementById('sync');
  el.textContent = SYNC_TXT[mode] || mode;
  el.className = 'sync' + (mode==='on' ? ' on' : '') + (mode==='login' ? ' cta' : '');
}
function applyRemote(key, d){
  if (!['cfg','buy','prog'].includes(key) || !d) return;
  const j = JSON.stringify(d);
  if (j === last[key]) return;
  last[key] = j;
  S[key] = key==='cfg' ? {...clone(DEFAULT_CFG), ...clone(d)} : clone(d);
  cacheLocal();
  const a = document.activeElement;
  if (a && (a.tagName==='INPUT' || a.tagName==='SELECT') && document.getElementById('app').contains(a)) return; // no interrumpir mientras escribe
  render();
}
async function startCloud(){
  cloud = false;
  if (channel) { sb.removeChannel(channel); channel = null; }
  if (!user) { setSync('login'); render(); return; }
  setSync('wait');
  const mem = await sb.from('cocina_familia').select('email').limit(1);
  if (mem.error) { setSync(/does not exist|schema cache|relation/i.test(mem.error.message) ? 'notable' : (navigator.onLine ? 'local' : 'offline')); render(); return; }
  if (!mem.data.length) { setSync('nomember'); render(); return; }
  const { data, error } = await sb.from('cocina_docs').select('key,data');
  if (error) { setSync('notable'); render(); return; }
  cloud = true;
  if (!data.length) {
    // Primera vez en la nube: sube lo que haya en este celular.
    for (const k of ['cfg','buy','prog']) await flush(k);
  } else {
    for (const r of data) applyRemote(r.key, r.data);
  }
  channel = sb.channel('cocina')
    .on('postgres_changes', { event:'*', schema:'public', table:'cocina_docs' }, p => { if (p.new && p.new.key) applyRemote(p.new.key, p.new.data); })
    .subscribe();
  setSync('on'); render();
}
(async () => {
  if (!(CONF.SUPABASE_URL && CONF.SUPABASE_ANON_KEY && window.supabase)) { setSync('local'); return; }
  sb = window.supabase.createClient(CONF.SUPABASE_URL, CONF.SUPABASE_ANON_KEY, { auth: { storageKey: 'cocina-sabado-auth', persistSession: true } });
  const { data } = await sb.auth.getSession();
  user = data.session ? data.session.user : null;
  sb.auth.onAuthStateChange((ev, session) => {
    const u = session ? session.user : null;
    if ((u && u.id) !== (user && user.id)) { user = u; startCloud(); }
    if (ev === 'PASSWORD_RECOVERY') { ui.account = true; ui.recover = true; render(); }
  });
  startCloud();
})();

const P = id => S.cfg.people.find(p => p.id===id);

const kids = () => S.cfg.people.filter(p => p.kind!=='adulto');
const priceOf = id => +(S.cfg.prices[id] ?? ING[id].price);
const recipe = () => RECIPES.find(r => r.id===S.cfg.lunchId) || RECIPES[0];
function money(v){ try { return new Intl.NumberFormat(CUR[S.cfg.currency]||'es-CO',{style:'currency',currency:S.cfg.currency,maximumFractionDigits:S.cfg.currency==='USD'||S.cfg.currency==='EUR'?2:0}).format(v) } catch(e){ return Math.round(v) } }
function grams(g){ return g>=1000 ? (g/1000).toLocaleString('es-CO',{maximumFractionDigits:1})+' kg' : Math.round(g)+' g' }
function nutri(r){
  let k=0,p=0,c=0,f=0,cost=0;
  for (const [id,g] of Object.entries(r.items)){ const i=ING[id]; k+=i.k*g/100; p+=i.p*g/100; c+=i.c*g/100; f+=i.f*g/100; cost+=priceOf(id)*g/1000; }
  return {k:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f),cost};
}
function portions(){ const a=adults().length, k=kids().length; return {perDay: a + k*S.cfg.childFactor, adultBoxes:a*S.cfg.days, kidBoxes:k*S.cfg.days, total:(a + k*S.cfg.childFactor)*S.cfg.days}; }
function targets(p){
  if (p.kind!=='adulto') return null;
  const w=+p.weight||70, h=+p.height||165, a=+p.age||35;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex==='M'?5:-161);
  const tdee = bmr * (ACT[p.activity]||ACT.ligero).f;
  const floor = p.sex==='M'?1600:1300;
  const kcal = Math.max(floor, Math.round(tdee*0.8/10)*10);
  const ref = Math.min(w, 24.5*(h/100)**2); // peso de referencia para no inflar la proteína
  const prot = Math.round(1.8*ref/5)*5;
  const fat = Math.round(0.8*ref/5)*5;
  const carb = Math.max(80, Math.round((kcal - prot*4 - fat*9)/4/5)*5);
  const bmi = w/((h/100)**2);
  const goalLow = Math.round(22*(h/100)**2), goalHigh = Math.round(24.9*(h/100)**2);
  return {kcal, tdee:Math.round(tdee), prot, fat, carb, bmi, goalLow, goalHigh, perWeek:[Math.round(w*0.005*10)/10, Math.round(w*0.01*10)/10]};
}

}

function chartSvg(entries){
  if (entries.length<2) return `<p class="small muted">Registren al menos dos pesajes para ver la línea.</p>`;
  const W=600,H=180,pl=40,pr=14,pt=14,pb=26;
  const xs = entries.map(e=>new Date(e.d).getTime()); const ys = entries.map(e=>+e.kg);
  const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1; let y0=Math.floor(Math.min(...ys)-1), y1=Math.ceil(Math.max(...ys)+1);
  const X = v => pl + (x1===x0?0:(v-x0)/(x1-x0))*(W-pl-pr); const Y = v => pt + (1-(v-y0)/(y1-y0))*(H-pt-pb);
  const pts = entries.map((e,i)=>`${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  const ticks = [y0, Math.round((y0+y1)/2), y1];
  const lastI = entries.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
    <polygon points="${X(xs[0])},${H-pb} ${pts} ${X(xs[lastI])},${H-pb}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(xs[lastI])}" cy="${Y(ys[lastI])}" r="5" fill="var(--accent)"/>
    <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtDate(entries[0].d)}</text>
    <text x="${W-pr}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(entries[lastI].d)}</text>
  </svg>`;
}
function fmtDate(s){ const d=new Date(s+'T12:00'); return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'}); }

      </div>
      <div class="targets">
        <div class="t"><span class="label">Gasta aprox.</span><b>${t.tdee.toLocaleString('es-CO')}</b><span class="small muted">kcal al día</span></div>
        <div class="t"><span class="label">Meta</span><b>${t.kcal.toLocaleString('es-CO')}</b><span class="small muted">kcal (−20 %)</span></div>
        <div class="t"><span class="label" style="color:var(--prot)">Proteína</span><b>${t.prot} g</b><span class="small muted">protege el músculo</span></div>
        <div class="t"><span class="label">Peso saludable</span><b>${t.goalLow}–${t.goalHigh}</b><span class="small muted">kg para su estatura</span></div>
      </div></div>`;
  }).join('');
  return `${exampleBanner()}
    <div class="stack"><h2>Familia y metas</h2>
    <p class="muted">Con un déficit moderado (20 %) y proteína alta se pierde grasa sin perder músculo, y el entrenamiento de fuerza ayuda a ganarlo. Los cambios se guardan solos.</p></div>
    ${blocks}
    <p class="note">Las calorías se calculan con la fórmula Mifflin-St Jeor. Son un punto de partida: si en 3 semanas el peso no baja, resten 100–150 kcal; si baja más de 1 % por semana o hay mucho cansancio, sumen.</p>`;
}

/* ============ Eventos ============ */
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
function go(){ const h=(location.hash||'#hoy').slice(1); ui.tab = ['hoy','almuerzo','mercado','progreso','familia'].includes(h)?h:'hoy'; render(); }
window.addEventListener('hashchange', () => { go(); window.scrollTo(0,0); });
let resetArmed = false;
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName==='INPUT' || b.tagName==='SELECT') return;
  const a = b.dataset.act;
  const val = id => (document.getElementById(id)||{}).value?.trim() || '';
  if (a==='account'){ ui.account=!ui.account; render(); window.scrollTo(0,0); return; }
  if (a==='installopen'){ if (installEvt){ installEvt.prompt(); installEvt=null; } else { ui.account=true; render(); window.scrollTo(0,0); } return; }
  if (a==='install'){ if (installEvt){ installEvt.prompt(); installEvt=null; render(); } return; }
  if (a==='skiplogin'){ ui.skipLogin=true; render(); return; }
  if (a==='login'||a==='signup'){
    const email=val('em'), password=(document.getElementById('pwd')||{}).value||'';
    if (!email || password.length<6){ toast('Escribe tu correo y una contraseña de al menos 6 caracteres'); return; }
    b.disabled=true;
    const r = a==='login' ? await sb.auth.signInWithPassword({email,password}) : await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});
    b.disabled=false;
    if (r.error){ toast(authMsg(r.error)); return; }
    if (a==='signup' && !r.data.session){ toast('Te enviamos un correo para confirmar la cuenta'); return; }
    ui.account=false; toast('Sesión iniciada'); render(); return;
  }
  if (a==='forgot'){ const email=val('em'); if(!email){ toast('Escribe tu correo arriba'); return; } const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]}); toast(r.error?authMsg(r.error):'Te enviamos un correo para cambiar la contraseña'); return; }
  if (a==='setpass'){ const pw=(document.getElementById('newpwd')||{}).value||''; const r=await sb.auth.updateUser({password:pw}); if(r.error){toast(authMsg(r.error));return;} ui.recover=false; ui.account=false; toast('Contraseña actualizada'); render(); return; }
  if (a==='logout'){ await sb.auth.signOut(); user=null; ui.account=false; startCloud(); toast('Sesión cerrada. Los datos siguen en este celular.'); return; }
  if (a==='person'){ ui.person=b.dataset.id; saveUi(); render(); }
  else if (a==='train'){ ui.train=b.dataset.v; saveUi(); render(); }
  else if (a==='lunch'){ S.cfg.lunchId=b.dataset.id; queue('cfg'); render(); toast('Almuerzo de la semana actualizado'); }
  else if (a==='soff'){ const id=b.dataset.id; const o=S.cfg.staples[id]||{}; o.off=!o.off; S.cfg.staples[id]=o; queue('cfg'); render(); }
  else if (a==='exadd'){ const n=document.getElementById('exn').value.trim(); const c=+document.getElementById('exc').value||0; if(!n){toast('Escribe qué quieres agregar');return;} S.cfg.extras=[...(S.cfg.extras||[]),{id:Date.now().toString(36),n,cost:c}]; queue('cfg'); render(); document.querySelector('details:last-of-type')?.setAttribute('open',''); }
  else if (a==='exdel'){ S.cfg.extras=(S.cfg.extras||[]).filter(x=>x.id!==b.dataset.id); queue('cfg'); render(); }
  else if (a==='reset'){
    const p=document.getElementById('confirmReset');
    if(!resetArmed){ resetArmed=true; b.textContent='Sí, desmarcar todo'; p.hidden=false; p.textContent='Se desmarcan todos los artículos para toda la familia.'; setTimeout(()=>{resetArmed=false;},5000); return; }
    resetArmed=false; S.buy.checks={}; queue('buy'); render(); toast('Lista lista para la próxima compra');
  }
  else if (a==='copy'){
    const lines = shoppingLines(); const txt = 'Mercado — Cocina del Sábado\n' + [...new Set(lines.map(l=>l.cat))].map(c=>'\n'+c.toUpperCase()+'\n'+lines.filter(l=>l.cat===c).map(l=>`- ${l.n}${l.q?' · '+l.q:''}`).join('\n')).join('\n');
    try { await navigator.clipboard.writeText(txt); toast('Lista copiada. Pégala en WhatsApp o en notas.'); }
    catch(err){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='width:100%;height:200px;margin-top:10px'; b.closest('.card').appendChild(ta); ta.select(); toast('Selecciona y copia el texto de abajo'); }
  }
  else if (a==='padd'){
    const who=document.getElementById('pw').value, d=document.getElementById('pd').value, kg=parseFloat(document.getElementById('pk').value), w=parseFloat(document.getElementById('pc').value);
    if(!d || !(kg>20 && kg<300)){ toast('Escribe un peso válido en kg'); return; }
    const ents=(S.prog.entries||[]).filter(x=>!(x.who===who && x.d===d)); ents.push({who,d,kg:Math.round(kg*10)/10, waist: w>0?Math.round(w*10)/10:null});
    S.prog.entries = ents.slice(-400);
    const p=P(who); if(p){ p.weight=Math.round(kg*10)/10; S.cfg.example=false; queue('cfg'); }
    queue('prog'); render(); toast('Pesaje guardado');
  }
  else if (a==='pdel'){ S.prog.entries=(S.prog.entries||[]).filter(x=>!(x.who===b.dataset.who && x.d===b.dataset.d)); queue('prog'); render(); }
});
document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  if (a==='check'){ S.buy.checks = {...(S.buy.checks||{}), [el.dataset.key]: el.checked}; if(!el.checked) delete S.buy.checks[el.dataset.key]; queue('buy'); render(); return; }
  if (a==='days'){ S.cfg.days=+el.value; }
  else if (a==='childFactor'){ S.cfg.childFactor=+el.value; }
  else if (a==='budget'){ S.cfg.budget=Math.max(0,+el.value||0); }
  else if (a==='currency'){ S.cfg.currency=el.value; toast('Recuerden poner los precios en '+el.value); }
  else if (a==='cardio'){ S.cfg.cardio=el.value; }
  else if (a==='sqty'||a==='sprice'){ const o=S.cfg.staples[el.dataset.id]||{}; o[a==='sqty'?'qty':'price']=Math.max(0,+el.value||0); S.cfg.staples[el.dataset.id]=o; }
  else if (a==='iprice'){ S.cfg.prices[el.dataset.id]=Math.max(0,+el.value||0); }
  else if (a==='pf'){ const p=P(el.dataset.id); const f=el.dataset.f; p[f] = ['age','weight','height'].includes(f) ? (+el.value||p[f]) : el.value; S.cfg.example=false; }
  else return;
  queue('cfg');
  const keepOpen = [...document.querySelectorAll('details')].map(d=>d.open);
  const fid = el.id; render();
  document.querySelectorAll('details').forEach((d,i)=>{ if(keepOpen[i]) d.open=true; });
  const again = fid && document.getElementById(fid); if (again && el.tagName==='SELECT') again.focus();
});
go();
</script>

</body>
</html>
